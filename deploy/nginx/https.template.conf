server {
  listen 80;
  server_name api.xxx.com admin.xxx.com cert.xxx.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.xxx.com;
  client_max_body_size 20m;

  ssl_certificate /etc/nginx/certs/api.xxx.com.pem;
  ssl_certificate_key /etc/nginx/certs/api.xxx.com.key;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  location / {
    proxy_pass http://backend:3000;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl http2;
  server_name admin.xxx.com;
  client_max_body_size 20m;

  ssl_certificate /etc/nginx/certs/admin.xxx.com.pem;
  ssl_certificate_key /etc/nginx/certs/admin.xxx.com.key;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  location / {
    proxy_pass http://admin-web:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl http2;
  server_name cert.xxx.com;
  client_max_body_size 20m;

  ssl_certificate /etc/nginx/certs/cert.xxx.com.pem;
  ssl_certificate_key /etc/nginx/certs/cert.xxx.com.key;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  location / {
    proxy_pass http://public-h5:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
