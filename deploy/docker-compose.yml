services:
  mysql:
    image: mysql:8.4
    container_name: guxin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: guxin-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      UPLOAD_DIR: /app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:${BACKEND_PORT:-3000}"
    volumes:
      - ${UPLOAD_DIR:-/opt/gxkjy/uploads}:/app/uploads

  admin-web:
    build:
      context: ..
      dockerfile: admin-web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/}
    container_name: guxin-admin-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"

  public-h5:
    build:
      context: ..
      dockerfile: public-h5/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_CERT_PUBLIC_BASE_URL: ${VITE_CERT_PUBLIC_BASE_URL}
    container_name: guxin-public-h5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"

  website:
    build:
      context: ..
      dockerfile: website/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: guxin-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"

  nginx:
    image: nginx:1.27-alpine
    container_name: guxin-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - admin-web
      - public-h5
      - website
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
      - ${UPLOAD_DIR:-/opt/gxkjy/uploads}:/var/www/uploads:ro

  mysql-backup:
    image: mysql:8.4
    container_name: guxin-mysql-backup
    profiles:
      - backup
    env_file:
      - ../.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    volumes:
      - ./backup:/backup
      - ./backup/backup-mysql.sh:/backup-mysql.sh:ro
    entrypoint: ["sh", "/backup-mysql.sh"]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  nginx_logs:
