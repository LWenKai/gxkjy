<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>检测详情｜谷芯快检云</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="app-shell" data-od-id="app-shell">
    
<section class="page" data-od-id="detection-detail-page">

<header class="topbar" data-od-id="topbar">
  <a class="back btn" href="detections.html" data-od-id="back-button">‹</a>
  <strong>检测详情</strong>
  <button class="btn btn-ghost" data-action="toast" data-message="已刷新当前页面" data-od-id="refresh-button">刷新</button>
</header>
  <section data-od-id="detection-detail-section-1" class="card section stack"><div class="row"><div><p class="label">样品名称</p><h1 class="title">西红柿</h1></div><span class="badge success">检测合格</span></div><p class="subtitle">检测时间：2026-07-14 09:42</p></section>
  <section class="section stack" data-od-id="test-items">
    <h2 class="title">检测项目明细</h2>
    <div class="card"><div class="row"><strong>有机磷</strong><span class="badge success">合格</span></div><p class="subtitle">检测值 1.0 mg/kg · 限量值 ≤ 5 mg/kg</p></div><div class="card"><div class="row"><strong>氨基甲酸酯</strong><span class="badge success">合格</span></div><p class="subtitle">检测值 2.1 mg/kg · 限量值 ≤ 5 mg/kg</p></div><div class="card"><div class="row"><strong>克百威</strong><span class="badge success">合格</span></div><p class="subtitle">检测值 3.2 mg/kg · 限量值 ≤ 5 mg/kg</p></div><div class="card"><div class="row"><strong>氧乐果</strong><span class="badge success">合格</span></div><p class="subtitle">检测值 4.3 mg/kg · 限量值 ≤ 5 mg/kg</p></div>
  </section>
  <div class="fixed-action"><a class="btn btn-primary" href="certificate-create.html">开具合格证</a><button class="btn btn-secondary" data-action="toast" data-message="不可开证时会在这里显示具体原因">查看不可开证提示</button></div>
</section>
  </main>
  <script src="../app.js"></script>
</body>
</html>
