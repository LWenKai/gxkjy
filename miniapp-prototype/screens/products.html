<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>常用产品｜谷芯快检云</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="app-shell" data-od-id="app-shell">
    
<section class="page" data-od-id="products-page">

<header class="topbar" data-od-id="topbar">
  <a class="back btn" href="profile.html" data-od-id="back-button">‹</a>
  <strong>常用产品</strong>
  <button class="btn btn-ghost" data-action="toast" data-message="已刷新当前页面" data-od-id="refresh-button">刷新</button>
</header>
  <div class="field section"><input data-search=".product-item" placeholder="搜索产品名称"></div>
  <section data-od-id="products-section-1" class="section stack">
    <div class="list-card product-item"><div class="row"><div><strong>西红柿</strong><p class="subtitle">默认单位：kg · 默认产地：山西太原</p></div><button class="btn btn-secondary" data-action="modal" data-target="product-modal">编辑</button></div></div><div class="list-card product-item"><div class="row"><div><strong>黄瓜</strong><p class="subtitle">默认单位：kg · 默认产地：山西晋中</p></div><button class="btn btn-secondary" data-action="modal" data-target="product-modal">编辑</button></div></div><div class="list-card product-item"><div class="row"><div><strong>净菜组合</strong><p class="subtitle">默认单位：盒 · 默认产地：山西太原</p></div><button class="btn btn-secondary" data-action="modal" data-target="product-modal">编辑</button></div></div>
  </section>
  <div class="empty hidden" id="empty-state">暂无常用产品，可新增后快速开证</div>
  <div class="fixed-action"><button class="btn btn-primary" data-action="modal" data-target="product-modal">新增产品</button></div>
</section>
<div class="modal-backdrop" id="product-modal"><div class="modal stack"><h2 class="title">编辑产品</h2><div class="field"><label>产品名称</label><input value="西红柿"></div><div class="field"><label>默认单位</label><input value="kg"></div><div class="field"><label>默认产地</label><input value="山西太原"></div><button class="btn btn-primary" data-action="close" data-target="product-modal">保存</button><button class="btn btn-danger" data-action="confirm" data-message="确认删除该产品？" data-done="已删除产品">删除</button></div></div>
  </main>
  <script src="../app.js"></script>
</body>
</html>
